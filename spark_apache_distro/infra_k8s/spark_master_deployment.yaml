apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-master
  namespace: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-master
  template:
    metadata:
      labels:
        app: spark-master
    spec:
      serviceAccountName: spark
      containers:
        - name: spark-master
          image: apache-spark:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 7077
            - containerPort: 8080
          env:
            - name: SPARK_MASTER_PORT
              value: "7077"
            - name: SPARK_MASTER_WEBUI_PORT
              value: "8080"
            - name: SPARK_MASTER_HOST
              value: "0.0.0.0"
            - name: SPARK_EVENTLOG_ENABLED
              value: "true"
            - name: SPARK_EVENTLOG_DIR
              value: file:///opt/spark/events
            - name: SPARK_HISTORY_OPTS
              value: -Dspark.history.fs.logDirectory=file:///opt/spark/events
            - name: PYSPARK_PYTHON
              value: /usr/bin/python3
            - name: PYSPARK_DRIVER_PYTHON
              value: /usr/bin/python3
          command:
              - /bin/bash
              - -c
              - |
                /opt/spark/sbin/start-master.sh
                tail -f /dev/null