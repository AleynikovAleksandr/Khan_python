apiVersion: v1
kind: Service

metadata:
  name: spark-master
  namespace: spark

spec:
  type: NodePort

  selector:
    app: spark-master

  ports:
    - name: spark-webui
      protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080

    - name: spark-cluster
      protocol: TCP
      port: 7077
      targetPort: 7077
      nodePort: 30077

    - name: spark-rest
      protocol: TCP
      port: 6066
      targetPort: 6066
      nodePort: 30066
